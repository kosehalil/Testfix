<!DOCTYPE html>
<html lang="tr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: Layout(~{::section})}">

<section>
    <header class="masthead">

        <div class="container">

            <div class="masthead-heading text-uppercase">
                İletişim
            </div>

            <div class="masthead-subheading">
                TESTFIX / İletişim
            </div>

        </div>

    </header>

    <section class="page-section bg-light" id="contact">

        <div class="container">

            <div class="text-center mb-5">

                <h2 class="section-heading text-muted">
                    Bizimle İletişime Geçin
                </h2>

                <p class="section-subheading text-muted">
                    Sorularınız, talepleriniz veya iş birliği önerileriniz için bizimle iletişime geçebilirsiniz.
                </p>

            </div>

            <div class="row g-5">
                <div class="col-lg-5">

                    <div class="contact-card h-100">

                        <h3 class="mb-4">İletişim Kanalları</h3>

                        <div class="contact-item">
                            <i class="fas fa-envelope"></i>
                            <div>
                                <h5>E-Mail</h5>
                                <p>info@testfix.com</p>
                            </div>
                        </div>

                        <div class="contact-item">
                            <i class="fab fa-whatsapp"></i>
                            <div>
                                <h5>WhatsApp</h5>
                                <p>+90 545 255 69 02</p>
                            </div>
                        </div>

                        <div class="contact-item">
                            <i class="fas fa-user-clock"></i>
                            <div>
                                <h5>Geri Dönüş Süresi</h5>
                                <p>Ortalama 24 saat içinde dönüş sağlanır.</p>
                            </div>
                        </div>

                    </div>

                </div>

                <div class="col-lg-7">

                    <div class="contact-card">

                        <form id="contactForm"
                              th:action="@{/contact}"
                              method="post">

                            <div class="row">

                                <div class="col-md-6 mb-4">

                                    <input class="form-control modern-input"
                                           type="text"
                                           name="name"
                                           placeholder="Adınız *"
                                           required>

                                </div>

                                <div class="col-md-6 mb-4">

                                    <input class="form-control modern-input"
                                           type="email"
                                           name="email"
                                           placeholder="E-Mail *"
                                           required>

                                </div>

                            </div>

                            <div class="mb-4">

                                <input class="form-control modern-input"
                                       type="tel"
                                       name="phone"
                                       placeholder="Telefon Numaranız *"
                                       required>

                            </div>

                            <div class="mb-4">

                                <textarea class="form-control modern-input"
                                          rows="7"
                                          name="message"
                                          placeholder="Mesajınız *"
                                          required></textarea>

                            </div>

                            <button class="btn btn-primary btn-xl text-uppercase w-100"
                                    type="submit">

                                Mesaj Gönder

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>

</section>

</html>
