<!DOCTYPE html>
<html lang="tr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: Layout(~{::section})}">

<section>

    <header class="masthead">
        <div class="container">
            <div class="masthead-heading text-uppercase">
                TEST ALIŞTIRMALARI
            </div>

            <div class="masthead-subheading">
                TESTFIX / Drag & Drop Testi
            </div>
        </div>
    </header>

    <section class="page-section bg-light" id="drag-drop-test">

        <div class="container">

            <div class="text-center mb-5">
                <h2 class="section-heading text-uppercase">
                    Drag & Drop Testi
                </h2>

                <h3 class="section-subheading text-muted">
                    Selenium ve manuel test pratikleri için örnek sürükle-bırak alanı
                </h3>
            </div>

            <div class="row justify-content-center g-4">
                <div class="col-md-4 text-center">

                    <div id="dragItem"
                         draggable="true"
                         ondragstart="drag(event)"
                         class="p-4 bg-primary text-white rounded shadow">

                        Elma

                    </div>

                </div>

                <div class="col-md-4 text-center">

                    <div id="dropZone"
                         ondrop="drop(event)"
                         ondragover="allowDrop(event)"
                         class="p-4 border border-3 rounded shadow d-flex align-items-center justify-content-center"
                         style="min-height:140px; border-style:dashed;">

                        Meyveler

                    </div>

                </div>

            </div>

        </div>

    </section>

    <script>

        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }

        function drop(ev) {

            ev.preventDefault();

            const data = ev.dataTransfer.getData("text");

            ev.target.appendChild(
                document.getElementById(data)
            );

            ev.target.style.backgroundColor = "#d1e7dd";
        }

    </script>

</section>

</html>
