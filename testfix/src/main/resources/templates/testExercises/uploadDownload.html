<!DOCTYPE html>
<html lang="tr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: Layout(~{::section})}">

<section>
    <header class="masthead">
        <div class="container">
            <div class="masthead-heading text-uppercase">
                TEST ALIŞTIRMALARI
            </div>

            <div class="masthead-subheading">
                TESTFIX / Upload - Download Testleri
            </div>
        </div>
    </header>

    <section class="page-section bg-light" id="upload-download-test">

        <div class="container">

            <div class="text-center mb-5">

                <h2 class="section-heading text-uppercase">
                    Upload / Download Testi
                </h2>

                <h3 class="section-subheading text-muted">
                    Dosya yükleme ve indirme alıştırmaları
                </h3>

            </div>

            <div class="row justify-content-center">

                <div class="col-md-6">

                    <div class="card shadow p-5 text-center">

                        <div class="mb-4">

                            <h5 class="mb-3">
                                Selenium İle Dosya İndirme
                            </h5>

                            <a href="/assets/img/errorPage.gif"
                               download
                               id="downloadButton"
                               class="btn btn-success btn-lg">

                                Download

                            </a>

                        </div>

                        <hr>

                        <div class="mt-4">

                            <h5 class="mb-3">
                                Selenium İle Dosya Yükleme
                            </h5>

                            <input type="file"
                                   id="uploadFile"
                                   class="form-control mb-3"/>

                            <button class="btn btn-primary btn-lg"
                                    id="uploadButton"
                                    disabled>

                                Upload

                            </button>

                            <p id="uploadResult"
                               class="mt-3 text-success fw-bold"
                               style="display:none;">

                                Dosya başarıyla seçildi

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <script>
        const uploadFile = document.getElementById("uploadFile");
        const uploadButton = document.getElementById("uploadButton");
        const uploadResult = document.getElementById("uploadResult");

        uploadFile.addEventListener("change", function () {

            if (uploadFile.files.length > 0) {

                uploadButton.disabled = false;

            } else {

                uploadButton.disabled = true;

            }

        });

        uploadButton.addEventListener("click", function () {

            uploadResult.style.display = "block";

        });
    </script>

</section>

</html>
