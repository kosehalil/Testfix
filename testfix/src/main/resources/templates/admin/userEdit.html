<!DOCTYPE html>
<html lang="tr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: Layout(~{::section})}">

<section>

    <div class="container mt-5">
        <div class="card shadow p-4">
            <h3 class="mb-4">
                Kullanıcı Düzenle
            </h3>
            <form th:action="@{/admin/users/update}"
                  method="post">

                <input type="hidden"
                       name="id"
                       th:value="${user.id}">

                <div class="mb-3">

                    <label>Kullanıcı Adı</label>

                    <input type="text"
                           name="username"
                           class="form-control"
                           th:value="${user.username}"
                           required>

                </div>

                <div class="mb-3">

                    <label>Şifre</label>

                    <input type="password"
                           name="password"
                           class="form-control"
                           th:value="${user.password}"
                           required>

                </div>

                <div class="mb-3">

                    <label>Rol</label>

                    <select name="role"
                            class="form-select"
                            required>

                        <option value="ADMIN"
                                th:selected="${user.role == 'ADMIN'}">
                            ADMIN
                        </option>

                        <option value="USER"
                                th:selected="${user.role == 'USER'}">
                            USER
                        </option>

                    </select>

                </div>

                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-warning">
                        Güncelle
                    </button>

                    <a th:href="@{/admin/users}"
                       class="btn btn-secondary">
                        İptal
                    </a>

                </div>

            </form>

        </div>

    </div>

</section>

</html>
