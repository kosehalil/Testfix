<!DOCTYPE html>
<html lang="tr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: Layout(~{::section})}">

<section>

    <div class="container" style="margin-top:120px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">
                Video Yönetimi
            </h2>

        </div>
        <div class="card shadow mb-4">

            <div class="card-body">

                <form method="post"
                      enctype="multipart/form-data"
                      th:action="@{/admin/videos/add}">

                    <div class="row g-3">
                        <div class="col-md-3">

                            <select name="courseId"
                                    class="form-control"
                                    required>

                                <option value="" disabled selected>
                                    Kurs Seç
                                </option>

								<option th:each="c : ${courses}"
								        th:value="${c != null ? c.id : 0}"
								        th:text="${c != null ? c.name : 'NULL'}">
								</option>

                            </select>

                        </div>

                        <div class="col-md-2">
                            <input type="text"
                                   name="title"
                                   class="form-control"
                                   placeholder="Başlık"
                                   required>
                        </div>

                        <div class="col-md-3">
                            <input type="text"
                                   name="description"
                                   class="form-control"
                                   placeholder="Açıklama"
                                   required>
                        </div>

                        <div class="col-md-2">
                            <input type="number"
                                   name="lessonOrder"
                                   class="form-control"
                                   placeholder="Sıra"
                                   required>
                        </div>

                        <div class="col-md-2">
                            <input type="file"
                                   name="videoFile"
                                   class="form-control"
                                   accept="video/mp4"
                                   required>
                        </div>

                        <div class="col-md-12 mt-3">
                            <button class="btn btn-success w-100">
                                Ekle
                            </button>
                        </div>

                    </div>

                </form>

            </div>

        </div>
        <div class="card shadow">

            <div class="card-body">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                        <tr>
                            <th>Sıra</th>
                            <th>Course</th>
                            <th>Başlık</th>
                            <th>Açıklama</th>
                            <th>Dosya</th>
                            <th>İşlem</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr th:each="v : ${videos}">

                            <td th:text="${v.lessonOrder}"></td>

                            <td th:text="${v.course != null ? v.course.name : 'Kurs Yok'}"></td>

                            <td th:text="${v.title}"></td>

                            <td th:text="${v.description}"></td>

                            <td th:text="${v.fileName}"></td>

                            <td>

                                <form th:action="@{'/admin/videos/delete/' + ${v.id}}"
                                      method="post">

                                    <button class="btn btn-danger btn-sm">
                                        Sil
                                    </button>

                                </form>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</section>

</html>
