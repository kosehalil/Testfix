<!DOCTYPE html>
<html lang="tr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: Layout(~{::section})}">

<section>

    <header class="masthead">

        <div class="container">

            <div class="masthead-heading text-uppercase">
                Haber Yönetimi
            </div>

        </div>

    </header>

    <section class="page-section bg-light">

        <div class="container">

            <div class="card shadow p-4 mb-5">

                <h3 class="mb-4">Yeni Haber Ekle</h3>

				<form th:action="@{/admin/news/save}" method="post">

				    <input type="text" name="title" class="form-control" required>

				    <input type="text" name="imageUrl" class="form-control">

				    <textarea name="content" class="form-control" required></textarea>

				    <button type="submit" class="btn btn-success">
				        Haberi Kaydet
				    </button>

				</form>

            </div>

            <div class="card shadow p-4">

                <h3 class="mb-4">Yayındaki Haberler</h3>

                <table class="table table-hover">

                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Başlık</th>
                        <th>Tarih</th>
                        <th>İşlem</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:if="${#lists.isEmpty(newsList)}">
                        <td colspan="4" class="text-center text-muted py-3">
                            Henüz haber yok
                        </td>
                    </tr>

                    <tr th:each="news : ${newsList}">

                        <td th:text="${news.id}"></td>

                        <td th:text="${news.title}"></td>

                        <td th:text="${#temporals.format(news.createdAt, 'dd-MM-yyyy HH:mm')}"></td>

                        <td>
                            <a th:href="@{/admin/news/delete/{id}(id=${news.id})}"
                               class="btn btn-danger btn-sm">
                                Sil
                            </a>
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </section>

</section>

</html>
