<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>404 - Sayfa Bulunamadı</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Tam ekran GIF */
        .error-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: url("/assets/img/errorPage.gif") no-repeat center center;
            background-size: cover;
        }

        /* Ortadaki yazı alanı */
        .error-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;

            background: rgba(0, 0, 0, 0.6);
            color: #fff;

            padding: 30px 40px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
        }

        .error-code {
            font-size: 72px;
            font-weight: bold;
            margin: 0;
            color: #ff7a00;
        }

        .error-title {
            font-size: 26px;
            margin: 10px 0;
        }

        .error-desc {
            font-size: 16px;
            opacity: 0.9;
        }

        /* Mobil uyum */
        @media (max-width: 768px) {
            .error-code {
                font-size: 48px;
            }
            .error-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-box">
            <div class="error-code">404</div>
            <div class="error-title">Sayfa Kullanılamıyor</div>
            <div class="error-desc">
                Aradığınız sayfa bulunamadı
            </div>
        </div>
    </div>

</body>
</html>
