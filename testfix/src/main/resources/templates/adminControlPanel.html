<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <title>Admin Panel | TESTFIX</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" href="/assets/favicon.ico">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js"></script>

    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Roboto+Slab:400,300,700" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">

    <style>
        body {
            font-family: Montserrat, sans-serif;
            background-color: #f8f9fa;
        }

        .admin-sidebar {
            width: 250px;
            background: #212529;
            min-height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 80px;
        }

        .admin-sidebar a {
            color: #adb5bd;
            display: block;
            padding: 14px 20px;
            text-decoration: none;
            font-size: 14px;
        }

        .admin-sidebar a:hover,
        .admin-sidebar a.active {
            background: #ffc800;
            color: #212529;
            font-weight: 600;
        }

        .admin-content {
            margin-left: 250px;
            padding: 40px;
        }

        .card {
            border: none;
            border-radius: 10px;
        }

        .card h5 {
            font-weight: 700;
        }
    </style>
</head>

<body>
<nav class="navbar navbar-dark fixed-top" style="background:#212529;">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">
            <img src="/assets/img/testfixx.png" height="32">
            <span class="ms-2">Admin Panel</span>
        </a>

        <div class="d-flex align-items-center text-white">
            <i class="fas fa-user-shield me-2"></i> Admin
            <a href="/logout" class="btn btn-sm btn-outline-warning ms-3">Çıkış</a>
        </div>
    </div>
</nav>
<div class="admin-sidebar">
	<div>
	</div>
    <a href="#" class="active"><i class="fas fa-chart-line me-2"></i> Dashboard</a>
    <a href="#"><i class="fas fa-users me-2"></i> Kullanıcılar</a>
    <a href="#"><i class="fas fa-file-alt me-2"></i> Testler</a>
    <a href="#"><i class="fas fa-envelope me-2"></i> Mesajlar</a>
    <a href="#"><i class="fas fa-cog me-2"></i> Ayarlar</a>
</div>
<div class="admin-content">
    <h2 class="text-uppercase mb-4">Dashboard</h2>

    <div class="row g-4">
        <div class="col-md-3">
            <div class="card shadow-sm p-4 text-center">
                <i class="fas fa-users fa-2x text-primary mb-2"></i>
                <h5>Toplam Kullanıcı</h5>
                <p class="fs-4 fw-bold">1</p>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm p-4 text-center">
                <i class="fas fa-file-alt fa-2x text-primary mb-2"></i>
                <h5>Test Sayısı</h5>
                <p class="fs-4 fw-bold">0</p>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm p-4 text-center">
                <i class="fas fa-envelope fa-2x text-primary mb-2"></i>
                <h5>Yeni Mesaj</h5>
                <p class="fs-4 fw-bold">0</p>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow-sm p-4 text-center">
                <i class="fas fa-user-check fa-2x text-primary mb-2"></i>
                <h5>Aktif Kullanıcı</h5>
                <p class="fs-4 fw-bold">1</p>
            </div>
        </div>
    </div>
	

	
	<footer class="footer py-4">
			              <div class="container">
			                  <div class="row align-items-center">
			                      <div class="col-lg-4 text-lg-start">&copy; 2025 TESTFIX | Tüm Hakları Saklıdır.</div>
			                      <div class="col-lg-4 my-3 my-lg-0">
			                          <a class="btn btn-dark btn-social mx-2" href="#!" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
			                          <a class="btn btn-dark btn-social mx-2" href="#!" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
			                          <a class="btn btn-dark btn-social mx-2" href="#!" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
			                      </div>
			                      <div class="col-lg-4 text-lg-end">
			                          <a class="link-dark text-decoration-none me-3" href="#!"></a>
			                          <a class="link-dark text-decoration-none" href="#!"></a>
			                      </div>
			                  </div>
			              </div>
			          </footer>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
