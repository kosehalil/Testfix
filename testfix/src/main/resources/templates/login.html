<!DOCTYPE html>
<html lang="tr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: Layout(~{::section})}">

<section>

    <!-- HEADER -->
    <header class="masthead">

        <div class="container">

            <div class="masthead-heading text-uppercase">
                LOGIN
            </div>

        </div>

    </header>
    <section class="page-section bg-light" id="login-test">

        <div class="container">

            <div class="row justify-content-center align-items-center">

                <!-- TEST USERS PANEL -->
                <div class="col-lg-4 mb-3">

                    <div class="card shadow border-0 p-4 h-100">

                        <h4 class="mb-4 text-uppercase">
                            Testfix Kullanıcıları
                        </h4>

                        <div class="mb-3">
                            <p class="fw-bold mb-1">ManuelTester</p>
                            <small class="text-muted">ManuelTester1234</small>
                        </div>

                        <hr>

                        <div class="mb-3">
                            <p class="fw-bold mb-1">QAEngineer</p>
                            <small class="text-muted">QAEngineer1234</small>
                        </div>

                        <hr>

                        <div class="mb-3">
                            <p class="fw-bold mb-1">TestEngineer</p>
                            <small class="text-muted">TestEngineer1234</small>
                        </div>

                        <hr>

                        <div class="mb-3">
                            <p class="fw-bold mb-1">TestTeamLead</p>
                            <small class="text-muted">TestTeamLead1234</small>
                        </div>

                        <hr>

                        <div>
                            <p class="fw-bold mb-1">TestSpecialist</p>
                            <small class="text-muted">TestSpecialist1234</small>
                        </div>

                    </div>

                </div>

                <div class="col-lg-6">

                    <div class="card shadow p-5">

                        <div th:if="${param.error}" class="alert alert-danger text-center">
                            Username veya password hatalı
                        </div>

                        <form th:action="@{/login}" method="post">
                            <div class="form-group mb-3">

                                <label for="usernameInput">
                                    Username
                                </label>

                                <input type="text"
                                       id="usernameInput"
                                       name="username"
                                       class="form-control"
                                       placeholder="Kullanıcı adını giriniz"
                                       required>

                            </div>


                            <div class="form-group mb-4">

                                <label for="passwordInput">
                                    Password
                                </label>

                                <input type="password"
                                       id="passwordInput"
                                       name="password"
                                       class="form-control"
                                       placeholder="Şifreyi giriniz"
                                       required>

                            </div>

                            <div class="text-center">

                                <button type="submit"
                                        class="btn btn-primary btn-xl">

                                    Login

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>

</section>

</html>
